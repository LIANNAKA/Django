{% extends "base.html" %}

{% block title %}
Home
{% endblock %}

{% block content %}
    {% if user.is_authenticated %}
        <h2>Hi {{ user.username }}!</h2>
        <p><form action="{% url 'logout' %}" method="post">
    {% csrf_token %}
    <button type="submit">Log Out</button>
</form></p>
    {% else %}
        <p>You are not logged in.</p>
        <a href="{% url 'login' %}">Log In</a>
        <a href="{% url 'signup' %}">Sign Up</a>
    {% endif %}
{% endblock %}
